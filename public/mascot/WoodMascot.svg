<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <filter id="woodTexture">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="3" result="noise" seed="2" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="2" />
    </filter>
    <radialGradient id="woodGradient" cx="40%" cy="40%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b6f47;stop-opacity:1" />
    </radialGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <!-- Backpack -->
  <g id="backpack">
    <rect x="50" y="45" width="100" height="75" rx="8" fill="#6b5344" filter="url(#woodTexture)" />
    <rect x="60" y="55" width="20" height="30" rx="3" fill="#8b7355" />
    <rect x="120" y="55" width="20" height="30" rx="3" fill="#8b7355" />
    <circle cx="70" cy="95" r="8" fill="#a0826d" />
    <circle cx="130" cy="95" r="8" fill="#a0826d" />
  </g>

  <!-- Body (wooden) -->
  <g id="body">
    <ellipse cx="100" cy="130" rx="45" ry="55" fill="url(#woodGradient)" filter="url(#woodTexture)" />
    <!-- Wooden sections -->
    <line x1="75" y1="90" x2="75" y2="170" stroke="#5a4a38" strokeWidth="1" opacity="0.3" />
    <line x1="100" y1="80" x2="100" y2="180" stroke="#5a4a38" strokeWidth="1" opacity="0.3" />
    <line x1="125" y1="90" x2="125" y2="170" stroke="#5a4a38" strokeWidth="1" opacity="0.3" />
  </g>

  <!-- Left Arm -->
  <g id="leftArm">
    <rect x="35" y="110" width="20" height="60" rx="10" fill="url(#woodGradient)" filter="url(#woodTexture)" />
    <circle cx="45" cy="170" r="12" fill="#8b6f47" />
  </g>

  <!-- Right Arm -->
  <g id="rightArm">
    <rect x="145" y="110" width="20" height="60" rx="10" fill="url(#woodGradient)" filter="url(#woodTexture)" />
    <circle cx="155" cy="170" r="12" fill="#8b6f47" />
  </g>

  <!-- Left Leg -->
  <g id="leftLeg">
    <rect x="70" y="175" width="15" height="50" rx="7" fill="url(#woodGradient)" filter="url(#woodTexture)" />
    <circle cx="77" cy="230" r="10" fill="#6b5344" />
  </g>

  <!-- Right Leg -->
  <g id="rightLeg">
    <rect x="115" y="175" width="15" height="50" rx="7" fill="url(#woodGradient)" filter="url(#woodTexture)" />
    <circle cx="122" cy="230" r="10" fill="#6b5344" />
  </g>

  <!-- Head -->
  <g id="head">
    <circle cx="100" cy="50" r="35" fill="url(#woodGradient)" filter="url(#woodTexture)" />
    <!-- Hint of leaves on top -->
    <path d="M 80 20 Q 75 10 85 5 Q 95 5 100 8 Q 105 5 115 5 Q 125 10 120 20" fill="#7cb342" opacity="0.7" />
    <path d="M 75 15 Q 70 8 80 3" fill="#558b2f" opacity="0.5" strokeWidth="2" stroke="#558b2f" />
    <path d="M 120 15 Q 130 8 120 3" fill="#558b2f" opacity="0.5" strokeWidth="2" stroke="#558b2f" />
  </g>

  <!-- Eyes (friendly & developer) -->
  <g id="eyes">
    <!-- Left eye -->
    <circle cx="85" cy="40" r="6" fill="#2c2c2c" />
    <circle cx="86" cy="39" r="2" fill="#ffffff" opacity="0.8" />
    <!-- Right eye -->
    <circle cx="115" cy="40" r="6" fill="#2c2c2c" />
    <circle cx="116" cy="39" r="2" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Eyebrows (developer look) -->
  <g id="eyebrows">
    <path d="M 78 32 Q 85 29 92 31" stroke="#5a4a38" strokeWidth="1.5" fill="none" />
    <path d="M 108 31 Q 115 29 122 32" stroke="#5a4a38" strokeWidth="1.5" fill="none" />
  </g>

  <!-- Smile -->
  <g id="smile">
    <path d="M 90 55 Q 100 62 110 55" stroke="#5a4a38" strokeWidth="2" fill="none" strokeLinecap="round" />
  </g>

  <!-- Beard (hint) -->
  <g id="beard">
    <path d="M 85 62 Q 100 68 115 62" stroke="#4a3a28" strokeWidth="1" opacity="0.5" fill="none" />
  </g>

  <!-- Tiny Laptop (in right hand area) -->
  <g id="laptop" opacity="0">
    <rect x="150" y="160" width="35" height="22" rx="2" fill="#333" />
    <rect x="152" y="162" width="31" height="16" fill="#0ea5e9" />
    <line x1="150" y1="182" x2="185" y2="182" stroke="#666" strokeWidth="1" />
  </g>

  <!-- Coffee cup (near backpack) -->
  <g id="coffee" opacity="0">
    <rect x="45" y="50" width="18" height="20" fill="#8b4513" rx="2" />
    <path d="M 62 55 Q 68 55 68 62 Q 68 68 62 68" fill="none" stroke="#8b4513" strokeWidth="2" />
    <ellipse cx="54" cy="50" rx="9" ry="3" fill="#a0522d" />
    <!-- Steam -->
    <path d="M 50 45 Q 48 40 50 35" stroke="#d4af37" strokeWidth="1" fill="none" opacity="0.6" />
    <path d="M 58 45 Q 56 40 58 35" stroke="#d4af37" strokeWidth="1" fill="none" opacity="0.6" />
  </g>

  <!-- Magnifying glass (hidden until needed) -->
  <g id="magnifyingGlass" opacity="0">
    <circle cx="165" cy="140" r="18" fill="none" stroke="#c0a080" strokeWidth="3" />
    <line x1="177" y1="152" x2="190" y2="165" stroke="#c0a080" strokeWidth="3" />
    <circle cx="165" cy="140" r="14" fill="none" stroke="#2c2c2c" strokeWidth="0.5" opacity="0.3" />
  </g>

  <!-- Flashlight (for dark mode) -->
  <g id="flashlight" opacity="0">
    <rect x="40" y="130" width="12" height="40" fill="#333" rx="2" />
    <circle cx="46" cy="125" r="8" fill="#ffd700" />
    <path d="M 40 125 L 35 115 L 52 115 Z" fill="#ffd700" opacity="0.7" />
  </g>
</svg>
